name: Build Card Scanner apps

# Builds installable apps from card-scanner/:
#   - desktop installers for macOS (.dmg), Windows (.exe) and Linux (.AppImage)
#   - an unsigned iPhone app (.ipa) to install with Sideloadly or AltStore
# On the default branch they are published to the "apps-latest" GitHub Release,
# so there's always one page to download the newest versions from.

on:
  push:
    paths:
      - 'card-scanner/**'
      - '.github/workflows/build-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: card-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: card-scanner/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            card-scanner/release/*.dmg
            card-scanner/release/*.exe
            card-scanner/release/*.AppImage
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: card-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: card-scanner/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/App.app build/Payload/
          cd build && zip -qry Card-Scanner-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: card-scanner/build/Card-Scanner-iOS-unsigned.ipa
          if-no-files-found: error

  release:
    if: github.ref_name == github.event.repository.default_branch
    needs: [desktop, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apps
          merge-multiple: true
      - name: Publish to the apps-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la apps
          gh release delete apps-latest --yes --cleanup-tag || true
          gh release create apps-latest apps/* \
            --target "${{ github.sha }}" \
            --title "Card Scanner apps (latest)" \
            --notes "Newest desktop and iPhone builds of Card Scanner. See card-scanner/README.md for install steps. Built from ${{ github.sha }}."
