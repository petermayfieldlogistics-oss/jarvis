name: Mythbound

# Tests and builds mythbound/ on every change.

on:
  push:
    paths:
      - 'mythbound/**'
      - '.github/workflows/mythbound.yml'
  pull_request:
    paths:
      - 'mythbound/**'
      - '.github/workflows/mythbound.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mythbound
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mythbound/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:single
      - uses: actions/upload-artifact@v4
        with:
          name: Mythbound
          path: mythbound/dist-single/Mythbound.html
